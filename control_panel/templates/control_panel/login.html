{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — CCDO</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'main/css/style.css' %}">
<style>body{background:var(--navy);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}</style>
</head>
<body>
<div class="form-panel" style="max-width:380px;width:100%">
  <p class="eyebrow">CCDO ADMIN</p>
  <h2>Sign in</h2>
  {% if form.errors %}<p style="color:var(--red);font-size:12px;margin-top:-6px">Invalid username or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Username{{ form.username }}</label>
    <label>Password{{ form.password }}</label>
    <button class="btn btn-primary" type="submit">Log in <span>→</span></button>
  </form>
</div>
</body>
</html>
